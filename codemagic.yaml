workflows:
  android-workflow:
    name: Advanced Android Build & Release Pipeline
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push #pueden ser tambien pull_request, tag, etc...
      branch_patterns:
        - pattern: 'master'
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      groups:
        - keystore_credentials
      vars:
        JAVA_VERSION: "17"
        APP_ENV: "production"
        PACKAGE_NAME: "com.javipulido.musicPlayer"
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Set Android SDK Location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Decode Android Keystore
        script: |
          # Decodifica la firma digital guardada como variable Base64
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks

      - name: Build & Lint check
        script: |
          cd android
          chmod +x gradlew
          ./gradlew lintRelease

      - name: Run Unit Tests & Code Coverage
        script: |
          cd android
          ./gradlew testReleaseUnitTest
      - name: Start Android Emulator & Run UI Tests
        script: |
          emulator-headful -avd emulator &
          adb wait-for-device
          cd android && ./gradlew connectedAndroidTest
        ignore_failure: true # Permite continuar aunque falle este paso

      - name: Build Android App Bundle (AAB) & APK
        script: |
          cd android
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
      - android/app/build/reports/tests/**
      - android/app/build/outputs/mapping/**/mapping.txt
    publishing:
      email:
        recipients:
          - javierpulido73@gmail.com
        notify:
          success: true
          failure: true
